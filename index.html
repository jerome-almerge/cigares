<!doctype html>
<html lang="fr" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes Cigares</title>
<style>
:root{
  --bg:#f6f2ec; --card:#ffffff; --ink:#2b2018; --muted:#8a7a6a; --accent:#8c4a2f;
  --gold:#b8860b; --line:#e7ddd0; --ok:#2e7d32; --chip:#f0e8dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120d; --card:#221a13; --ink:#efe6da; --muted:#a3917e; --accent:#d98e5f;
    --gold:#e0b84c; --line:#36291e; --ok:#7bc47f; --chip:#2e241a;
  }
}
:root[data-theme="dark"]{
  --bg:#17120d; --card:#221a13; --ink:#efe6da; --muted:#a3917e; --accent:#d98e5f;
  --gold:#e0b84c; --line:#36291e; --ok:#7bc47f; --chip:#2e241a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:1.25rem;margin:0 0 8px;letter-spacing:.5px}
h1 small{color:var(--muted);font-weight:normal;font-size:.75rem}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input[type=search],select{flex:1 1 140px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;min-width:0}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}
.count{color:var(--muted);font-size:.85rem;margin:6px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;cursor:pointer}
.card:active{opacity:.8}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.marque{color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
.nom{font-weight:bold}
.note{color:var(--gold);white-space:nowrap;font-size:.95rem}
.meta{color:var(--muted);font-size:.85rem;margin-top:2px}
.badges{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:20px;padding:2px 10px;font-size:.75rem;color:var(--muted)}
.chip.cave{color:var(--ok);font-weight:bold}
.detail .card{cursor:default}
.back{display:inline-block;margin:4px 0 2px;color:var(--accent);cursor:pointer;font-size:.9rem}
.deg{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.deg:first-of-type{border-top:none}
.degdate{color:var(--muted);font-size:.8rem}
.degnote{color:var(--gold);font-size:.9rem}
.txt{white-space:pre-line;margin:6px 0 0;font-size:.95rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:8px}
.stars{color:var(--gold);letter-spacing:2px;font-size:.8rem}
.nd{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:.8rem;color:var(--muted);margin-top:6px}
footer{color:var(--muted);text-align:center;font-size:.75rem;padding:20px;border-top:1px solid var(--line)}
.vide{color:var(--muted);text-align:center;padding:30px 0}
.onglets{display:flex;gap:8px;margin-bottom:8px}
.onglets button{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer}
.onglets button.actif{color:var(--accent);border-color:var(--accent);font-weight:bold}
.chrono{display:flex;align-items:flex-end;gap:4px;padding:22px 2px 6px;overflow-x:auto}
.cGrp{flex:1 1 0;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:10px;padding:6px 2px}
.cGrp:active{background:var(--chip)}
.cCols{display:flex;align-items:flex-end;gap:3px;height:120px}
.cCol{width:15px;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cCol.e{background:var(--ok)}.cCol.s{background:var(--accent)}
.cCol .v{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--muted)}
.cGrp .per{font-size:.75rem;font-weight:bold}
.cGrp .solde{font-size:.65rem;border-radius:9px;padding:1px 7px;background:var(--chip);color:var(--muted)}
.cGrp .solde.plus{color:var(--ok)}.cGrp .solde.moins{color:var(--accent)}
.cLeg{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin:4px 2px;flex-wrap:wrap}
.cLeg .pt{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mvtL{display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-top:1px solid var(--line);font-size:.9rem}
.mvtL:first-of-type{border-top:none}
.mvtL .d{color:var(--muted);font-size:.75rem;white-space:nowrap}
.mvtL .n{flex:1;min-width:0}
.mvtL.lien{cursor:pointer}

.bTuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.bTuile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.bTuile .ch{font-size:1.6rem;font-weight:bold;color:var(--accent)}
.bTuile .lg{font-size:.75rem;color:var(--muted)}
.bPan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.bPan h3{margin:0 0 8px;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bPan h3 small{text-transform:none;letter-spacing:0;font-weight:normal}
.bRang{display:grid;grid-template-columns:minmax(90px,38%) 1fr 2.2em 3.2em;gap:6px;align-items:center;font-size:.85rem;margin:3px 0}
.bRang .bf{background:var(--line);border-radius:4px;height:10px;overflow:hidden}
.bRang .br{background:var(--accent);height:100%}
.bRang .nb{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bRang .mn{text-align:right;color:var(--accent);font-weight:bold;font-variant-numeric:tabular-nums;white-space:nowrap}
/* civettes */
.achat{font-size:.82rem;color:var(--muted);margin-top:4px}
.achat a,.lienCiv{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
.catTitre{margin:22px 2px 4px;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.catTitre small{display:block;text-transform:none;letter-spacing:0;font-size:.78rem}
.catItem{background:transparent;border:1px dashed var(--line);border-radius:12px;padding:9px 12px;margin:8px 0}
.catItem .nom{font-weight:normal}
.catItem a{font-size:.78rem;color:var(--accent);text-decoration:none;white-space:nowrap}
.catPlus{color:var(--muted);font-size:.85rem;text-align:center;padding:8px 0 4px;font-style:italic}
.civT{width:100%;border-collapse:collapse;font-size:.85rem}
.civT th{text-align:left;font-weight:normal;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:4px 6px 6px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.civT th.num,.civT td.num{text-align:right}
.civT th.on{color:var(--accent)}
.civT td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.civT tr:last-child td{border-bottom:none}
.civT tbody tr{cursor:pointer}
.civT tbody tr:active{background:var(--chip)}
.civT td.nm{color:var(--ink)}
.civT td.vl{color:var(--muted)}
.civT td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.civT td.mn{color:var(--accent);font-weight:bold}
.voile{position:fixed;inset:0;z-index:20;background:rgba(20,14,9,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.modale{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:16px 18px 20px;position:relative}
.modale h2{font-size:1.15rem;margin:0 36px 4px 0;line-height:1.3}
.fermer{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer;line-height:1}
.civLiens{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.civLiens a{background:var(--chip);color:var(--accent);border-radius:20px;padding:4px 12px;font-size:.82rem;text-decoration:none}
.civCig{display:flex;gap:8px;align-items:baseline;padding:8px 2px;border-top:1px solid var(--line);font-size:.9rem}
.civCig:first-of-type{border-top:none}
.civCig .n{flex:1;min-width:0}
.civCig .n small{display:block;color:var(--muted);font-size:.75rem}
.civCig .dr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.civCig .st{color:var(--ok);font-size:.75rem;white-space:nowrap}
.civCig.lien{cursor:pointer}
@media (max-width:600px){
  .voile{padding:0;align-items:stretch}
  .modale{border-radius:0;border:none;max-width:none;height:100%;max-height:none}
}
</style>
</head>
<body>
<header>
  <h1>Mes Cigares <small id="version"></small></h1>
  <div class="onglets">
    <button id="ongCigares" class="actif" onclick="allerOnglet('cigares')">Cigares</button>
    <button id="ongTemps" onclick="allerOnglet('temps')">Au fil du temps</button>
    <button id="ongBord" onclick="allerOnglet('bord')">Tableau de bord</button>
  </div>
  <div class="controls" id="barreCigares">
    <input type="search" id="q" placeholder="Marque, cigare, arôme…" autocomplete="off">
    <select id="filtre">
      <option value="">Tous</option>
      <option value="cave">En cave</option>
      <option value="degustes">Dégustés</option>
      <option value="avis">Avec mon avis</option>
    </select>
    <select id="tri">
      <option value="note">Tri : ma note</option>
      <option value="marque">Tri : marque</option>
      <option value="recent">Tri : dernière dégustation</option>
    </select>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="liste"></div>
  <div id="catalogue"></div>
  <div id="detail" class="detail" style="display:none"></div>
  <div id="temps" style="display:none"></div>
<div id="bord" style="display:none"></div>
</main>
<div id="civVoile" class="voile" style="display:none" onclick="if(event.target===this)fermerCiv()">
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="civNom" id="civModale"></div>
</div>
<footer>Données personnelles de dégustation — mises à jour depuis ma base locale.</footer>
<script src="donnees-public.js?v=2026-10-15-1"></script>
<script>
const D = window.DONNEES_PUB || {referentiel:[],degustations:[],stock:{}};
D.catalogue = D.catalogue || []; D.civettes = D.civettes || [];
document.getElementById('version').textContent = 'v' + (D.version || '');
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’'`]/g,' ');
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const degsParRef = {};
for (const g of D.degustations) (degsParRef[g.refId] = degsParRef[g.refId] || []).push(g);
for (const k in degsParRef) degsParRef[k].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
/* civettes : où j'ai acheté chaque cigare (dégustations + achats sans dégustation) */
const degParId = {}; for (const g of D.degustations) degParId[g.id] = g;
const civParId = {}, civsParRef = {};
for (const c of D.civettes){
  civParId[c.id] = c;
  const refs = new Set(c.refIds||[]);
  for (const gid of c.degustations||[]){ const g=degParId[gid]; if(g&&g.refId) refs.add(g.refId); }
  c.refs = [...refs];
  for (const r of c.refs) (civsParRef[r] = civsParRef[r] || []).push(c);
}
const fiches = D.referentiel.map(r => {
  const gs = degsParRef[r.id] || [];
  const notes = gs.map(g=>g.maNote).filter(n=>typeof n==='number');
  const maNote = notes.length ? notes[0] : null; // note la plus récente
  const texte = gs.some(g=>(g.publication||g.ressenti||g.contexte||'').trim());
  return {...r, gs, maNote, nbDeg:gs.length, texte,
    derniere: gs.length ? String(gs[0].date) : '',
    stock: D.stock[r.id] || 0,
    civs: civsParRef[r.id] || [],
    hay: norm(r.marque+' '+r.nom+' '+r.vitole+' '+r.paysFab+' '+r.cape+' '+r.tripe+' '+gs.map(g=>(g.publication||'')+' '+(g.ressenti||'')).join(' '))};
});
const ficheParId = {}; for (const x of fiches) ficheParId[x.id] = x;
/* catalogue L'Amateur : uniquement ce qui n'est pas déjà dans mes cigares */
const catalogue = D.catalogue.filter(c => !(c.refId && ficheParId[c.refId]))
  .map(c => ({...c, hay: norm([c.titre,c.vitole,c.module,c.fab,c.intensite,c.slug.replace(/-/g,' ')].join(' '))}));
const $=id=>document.getElementById(id);
const et=n=>n==null?'':'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
function fdate(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; const [a,m,j]=s.split('-'); return j+'/'+m+'/'+a; }
const virgule = n => n.toFixed(1).replace('.',',');
function achatHtml(x){
  if(!x.civs.length) return '';
  return `<div class="achat">Acheté chez : ${x.civs.map(c=>`<a onclick="event.stopPropagation();ouvrirCiv('${c.id}')">${esc(c.nom.split(' — ')[0])}</a>${c.ville?' ('+esc(c.ville)+')':''}`).join(', ')}</div>`;
}
const CAT_MAX = 30;
function rendreCatalogue(mots){
  const el=$('catalogue');
  if(!mots.length){ el.innerHTML=''; return; }
  const R=catalogue.filter(c=>mots.every(m=>c.hay.includes(m)));
  if(!R.length){ el.innerHTML=''; return; }
  R.sort((a,b)=>(a.titre+' '+a.vitole).localeCompare(b.titre+' '+b.vitole,'fr'));
  el.innerHTML=`<div class="catTitre">Au catalogue de L'Amateur de Cigare <small>pas encore dans ma cave — ${R.length} résultat${R.length>1?'s':''}</small></div>`+
    R.slice(0,CAT_MAX).map(c=>`<div class="catItem">
      <div class="row"><span class="marque">${esc(c.titre)}</span>${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">fiche L'Amateur ↗</a>`:''}</div>
      <div class="nom">${esc(c.vitole)}</div>
      <div class="meta">${[c.module,c.fab,c.intensite].filter(Boolean).map(esc).join(' · ')}</div></div>`).join('')+
    (R.length>CAT_MAX?`<div class="catPlus">${R.length-CAT_MAX} autre${R.length-CAT_MAX>1?'s':''} résultat${R.length-CAT_MAX>1?'s':''}, affine ta recherche</div>`:'');
}
function rendre(){
  const q=norm($('q').value.trim()), f=$('filtre').value, t=$('tri').value;
  const mots=q.length>=2?q.split(/\s+/).filter(Boolean):[];
  let L=fiches.filter(x=>!mots.length||mots.every(m=>x.hay.includes(m)));
  if(f==='cave')L=L.filter(x=>x.stock>0);
  if(f==='degustes')L=L.filter(x=>x.nbDeg>0);
  if(f==='avis')L=L.filter(x=>x.texte);
  if(t==='note')L.sort((a,b)=>(b.maNote??-1)-(a.maNote??-1));
  if(t==='marque')L.sort((a,b)=>(a.marque+a.nom).localeCompare(b.marque+b.nom));
  if(t==='recent')L.sort((a,b)=>b.derniere.localeCompare(a.derniere));
  $('count').textContent=L.length+' cigare'+(L.length>1?'s':'');
  $('detail').style.display='none';
  $('liste').style.display='';
  $('liste').innerHTML=L.length?L.map(x=>`
   <div class="card" onclick="voir('${x.id}')">
     <div class="row"><span class="marque">${x.marque||''}</span>
       <span class="note">${x.maNote!=null?'★ '+x.maNote.toFixed(1):''}</span></div>
     <div class="nom">${x.nom||x.id}</div>
     <div class="meta">${[x.vitole,x.paysFab].filter(Boolean).join(' · ')}</div>
     <div class="badges">
       ${x.stock>0?`<span class="chip cave">En cave ×${x.stock}</span>`:''}
       ${x.nbDeg?`<span class="chip">${x.nbDeg} dégustation${x.nbDeg>1?'s':''}</span>`:''}
       ${x.texte?'<span class="chip">mon avis ✍</span>':''}
     </div>
     ${achatHtml(x)}
   </div>`).join(''):`<div class="vide">Aucun de mes cigares ne correspond.</div>`;
  $('catalogue').style.display='';
  rendreCatalogue(mots);
}
/* ===== onglets ===== */
let onglet='cigares';
function allerOnglet(o){
  onglet=o; retourCiv=null;
  document.getElementById('ongCigares').classList.toggle('actif',o==='cigares');
  document.getElementById('ongTemps').classList.toggle('actif',o==='temps');
  document.getElementById('ongBord').classList.toggle('actif',o==='bord');
  $('barreCigares').style.display=o==='cigares'?'':'none';
  $('count').style.display=o==='cigares'?'':'none';
  $('temps').style.display=o==='temps'?'':'none';
  $('bord').style.display=o==='bord'?'':'none';
  $('detail').style.display='none';
  $('liste').style.display=o==='cigares'?'':'none';
  $('catalogue').style.display=o==='cigares'?'':'none';
  if(o==='cigares') rendre();
  else if(o==='temps') rendreTemps();
  else rendreBord();
  window.scrollTo(0,0);
}
/* ===== au fil du temps (nombres uniquement) ===== */
const MOIS_C=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
const MOIS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let tempsVue={};
function rendreTemps(){
  const M=D.mouvements||[];
  const el=$('temps');
  const somme=l=>l.reduce((s,m)=>s+(m.q||0),0);
  const E=M.filter(m=>m.t==='e'), S=M.filter(m=>m.t==='s');
  const solde=somme(E)-somme(S);
  let nav='', corps='', titre='', aide='';
  if(tempsVue.mois){
    titre='Détail de '+MOIS_L[parseInt(tempsVue.mois.slice(5))-1]+' '+tempsVue.mois.slice(0,4);
    nav=`<span class="back" onclick="tempsVue={};rendreTemps()">← Toutes les années</span> &nbsp;
         <span class="back" onclick="delete tempsVue.mois;rendreTemps()">← ${tempsVue.annee} mois par mois</span>`;
    const fil=M.filter(m=>m.d.slice(0,7)===tempsVue.mois);
    const lig=m=>{const r=fiches.find(f=>f.id===m.ref);
      return `<div class="mvtL${r?' lien':''}" ${r?`onclick="voir('${m.ref}')"`:''}>
        <span class="d">${m.d.slice(8)}/${m.d.slice(5,7)}</span>
        <span class="n">${m.n||m.ref}${(m.q||1)>1?' ×'+m.q:''}</span>${r?'<span>›</span>':''}</div>`;};
    const Em=fil.filter(m=>m.t==='e').sort((a,b)=>a.d<b.d?-1:1);
    const Sm=fil.filter(m=>m.t==='s').sort((a,b)=>a.d<b.d?-1:1);
    corps=`<div class="card" style="cursor:default"><div class="lbl" style="color:var(--ok)">🟢 Rentrés (${somme(Em)})</div>
        ${Em.map(lig).join('')||'<div class="vide">Aucune entrée ce mois-ci.</div>'}</div>
      <div class="card" style="cursor:default"><div class="lbl" style="color:var(--accent)">🔴 Dégustés / sortis (${somme(Sm)})</div>
        ${Sm.map(lig).join('')||'<div class="vide">Aucune sortie ce mois-ci.</div>'}</div>`;
  } else {
    const parAnnee=!tempsVue.annee;
    titre=parAnnee?'Année par année':tempsVue.annee+' — mois par mois';
    aide=parAnnee?'touche une année pour le mois par mois':'touche un mois pour le détail';
    if(!parAnnee) nav=`<span class="back" onclick="tempsVue={};rendreTemps()">← Toutes les années</span>`;
    const fil=parAnnee?M:M.filter(m=>m.d.slice(0,4)===tempsVue.annee);
    const par={};
    for(const m of fil){const k=parAnnee?m.d.slice(0,4):m.d.slice(0,7);(par[k]=par[k]||{e:0,s:0})[m.t]+=m.q||0;}
    const cles=Object.keys(par).sort();
    const max=Math.max(1,...cles.flatMap(k=>[par[k].e,par[k].s]));
    corps=`<div class="chrono">`+cles.map(k=>{
      const p=par[k], so=p.e-p.s, lib=parAnnee?k:MOIS_C[parseInt(k.slice(5))-1];
      const clic=parAnnee?`tempsVue={annee:'${k}'};rendreTemps()`:`tempsVue.mois='${k}';rendreTemps()`;
      return `<div class="cGrp" onclick="${clic}">
        <div class="cCols">
          <div class="cCol e" style="height:${Math.max(2,Math.round(p.e/max*120))}px"><span class="v">${p.e||''}</span></div>
          <div class="cCol s" style="height:${Math.max(2,Math.round(p.s/max*120))}px"><span class="v">${p.s||''}</span></div>
        </div><span class="per">${lib}</span>
        <span class="solde ${so>0?'plus':so<0?'moins':''}">${so>0?'+':''}${so}</span></div>`;
    }).join('')+`</div>`;
  }
  el.innerHTML=`<div class="count">${somme(E)} rentrés · ${somme(S)} dégustés · solde ${solde>0?'+':''}${solde} en cave</div>
    ${nav?`<div style="margin:4px 0">${nav}</div>`:''}
    <div class="card" style="cursor:default">
      <div class="row"><b>${titre}</b><span class="degdate">${aide}</span></div>
      <div class="cLeg"><span><span class="pt" style="background:var(--ok)"></span>rentrés</span>
        <span><span class="pt" style="background:var(--accent)"></span>dégustés / sortis</span></div>
      ${corps.startsWith('<div class="chrono"')?corps:''}
    </div>${corps.startsWith('<div class="chrono"')?'':corps}`;
}
function voir(id){
  const x=fiches.find(f=>f.id===id); if(!x)return;
  $('liste').style.display='none';
  $('catalogue').style.display='none';
  $('temps').style.display='none';
  $('bord').style.display='none';
  const dv=$('detail'); dv.style.display='';
  const origines=[['Pays',x.paysFab],['Cape',x.cape],['Sous-cape',x.sousCape],['Tripe',x.tripe]].filter(o=>o[1]);
  dv.innerHTML=`<span class="back" onclick="retourDepuisFiche()">← Retour</span>
   <div class="card">
    <div class="row"><span class="marque">${x.marque||''}</span>
      <span class="note">${x.maNote!=null?'★ '+x.maNote.toFixed(1):''}</span></div>
    <div class="nom" style="font-size:1.15rem">${x.nom||x.id}</div>
    <div class="meta">${[x.vitole,x.module,x.dimensions].filter(Boolean).join(' · ')}</div>
    ${x.stock>0?`<div class="badges"><span class="chip cave">En cave ×${x.stock}</span></div>`:''}
    ${achatHtml(x)}
    ${origines.length?`<div class="lbl">Origines</div><div class="nd">${origines.map(o=>`<span>${o[0]}</span><span>${o[1]}</span>`).join('')}</div>`:''}
    ${x.gs.map(g=>{
      const nd=g.notesDetail;
      return `<div class="deg">
      <div class="row"><span class="degdate">${fdate(String(g.date))}${g.precision&&g.precision!=='exacte'?' (approx.)':''}</span>
        <span class="degnote">${g.maNote!=null?'★ '+g.maNote:''}</span></div>
      ${nd?`<div class="nd"><span>Tirage</span><span class="stars">${et(nd.tirage)}</span><span>Apparence</span><span class="stars">${et(nd.apparence)}</span><span>Combustion</span><span class="stars">${et(nd.combustion)}</span><span>Arôme</span><span class="stars">${et(nd.arome)}</span><span>Goût</span><span class="stars">${et(nd.gout)}</span></div>`:''}
      ${g.contexte?`<div class="lbl">Contexte</div><div class="txt">${g.contexte}</div>`:''}
      ${g.ressenti?`<div class="lbl">Ressenti</div><div class="txt">${g.ressenti}</div>`:''}
      ${g.publication?`<div class="lbl">Mon avis</div><div class="txt">${g.publication}</div>`:''}
      </div>`;}).join('')||'<div class="vide">Pas encore dégusté.</div>'}
   </div>`;
  window.scrollTo(0,0);
}
function retourDepuisFiche(){
  $('detail').style.display='none';
  if(retourCiv){ const c=retourCiv; retourCiv=null; allerOnglet('bord'); ouvrirCiv(c); return; }
  if(onglet==='temps'){ $('temps').style.display=''; rendreTemps(); window.scrollTo(0,0); }
  else if(onglet==='bord'){ $('bord').style.display=''; rendreBord(); window.scrollTo(0,0); }
  else rendre();
}

/* ===== tableau de bord ===== */
function rendreBord(){
  const R=D.referentiel, G=D.degustations;
  const stockN=Object.values(D.stock||{}).reduce((a,b)=>a+b,0);
  const parId={}; for(const r of R) parId[r.id]=r;
  const notesPar=fn=>{const acc={};for(const g of G){const n=parseFloat(g.maNote);if(!n||!g.refId)continue;const r=parId[g.refId];if(!r)continue;const ks=fn(r);if(!ks)continue;for(const k of String(ks).split(',').map(s=>s.trim()).filter(Boolean)){(acc[k]=acc[k]||[]).push(n);}}
    const m={};for(const k in acc)m[k]=acc[k].reduce((a,b)=>a+b,0)/acc[k].length;return m;};
  const comptePar=fn=>{const o={};for(const r of R){const ks=fn(r);if(!ks)continue;for(const k of String(ks).split(',').map(s=>s.trim()).filter(Boolean)){o[k]=(o[k]||0)+1;}}return o;};
  const table=(titre,obj,moy,cap)=>{cap=cap||12;let e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
    if(e.length>cap){const reste=e.slice(cap).reduce((s,x)=>s+x[1],0);e=e.slice(0,cap);e.push(['… autres',reste]);}
    const max=Math.max(...e.map(x=>x[1]),1);
    return `<div class="bPan"><h3>${titre} <small>— ★ ma note moyenne</small></h3>`+
      e.map(([k,v])=>`<div class="bRang"><span>${k}</span><div class="bf"><div class="br" style="width:${Math.round(v/max*100)}%"></div></div><span class="nb">${v}</span><span class="mn">${moy[k]!=null?'★ '+moy[k].toFixed(1).replace('.',','):'—'}</span></div>`).join('')+'</div>';};
  $('bord').innerHTML=`
   <div class="bTuiles">
    <div class="bTuile"><div class="ch">${G.length}</div><div class="lg">dégustations</div></div>
    <div class="bTuile"><div class="ch">${R.length}</div><div class="lg">cigares au référentiel</div></div>
    <div class="bTuile"><div class="ch">${stockN}</div><div class="lg">cigares en cave</div></div>
   </div><div class="bPan" id="civPan"></div>`+
   table('Pays de fabrication',comptePar(r=>r.paysFab),notesPar(r=>r.paysFab))+
   table('Origine des capes',comptePar(r=>r.cape&&r.cape.split('(')[0]),notesPar(r=>r.cape&&r.cape.split('(')[0]))+
   table('Origine des tripes',comptePar(r=>r.tripe),notesPar(r=>r.tripe))+
   table('Intensité',comptePar(r=>r.intensite),notesPar(r=>r.intensite))+
   table('Marques',comptePar(r=>r.marque),notesPar(r=>r.marque),9999);
  rendreCivTable();
  window.scrollTo(0,0);
}
/* ===== mes civettes ===== */
const civLignes = D.civettes.map(c=>{
  const gs=(c.degustations||[]).map(id=>degParId[id]).filter(Boolean);
  const n=gs.map(g=>parseFloat(g.maNote)).filter(v=>v>0);
  return {c, nom:c.nom, ville:c.ville||'', nb:gs.length, moy:n.length?n.reduce((a,b)=>a+b,0)/n.length:null};
});
let civTri={col:'nb',sens:-1};
function trierCiv(col){
  civTri = civTri.col===col ? {col, sens:-civTri.sens} : {col, sens:(col==='nb'||col==='moy')?-1:1};
  rendreCivTable();
}
function rendreCivTable(){
  const el=$('civPan'); if(!el) return;
  const {col,sens}=civTri;
  const L=[...civLignes].sort((a,b)=>{
    const va=a[col], vb=b[col];
    if(va==null&&vb==null) return a.nom.localeCompare(b.nom,'fr');
    if(va==null) return 1; if(vb==null) return -1;   // les « — » toujours en bas
    const r=typeof va==='number'?va-vb:String(va).localeCompare(String(vb),'fr');
    return r*sens || a.nom.localeCompare(b.nom,'fr');
  });
  const th=(k,lib,num)=>`<th class="${num?'num ':''}${col===k?'on':''}" onclick="trierCiv('${k}')" aria-sort="${col===k?(sens>0?'ascending':'descending'):'none'}">${lib}${col===k?(sens>0?' ▲':' ▼'):''}</th>`;
  el.innerHTML=`<h3>Mes civettes <small>— là où j'achète mes cigares</small></h3>
    <table class="civT"><thead><tr>${th('nom','Civette')}${th('ville','Ville')}${th('nb','Dég.',1)}${th('moy','★ moy.',1)}</tr></thead>
    <tbody>${L.map(x=>`<tr onclick="ouvrirCiv('${x.c.id}')"><td class="nm">${esc(x.nom.split(' — ')[0])}</td><td class="vl">${esc(x.ville)}</td>
      <td class="num">${x.nb}</td><td class="num mn">${x.moy!=null?'★ '+virgule(x.moy):'—'}</td></tr>`).join('')}</tbody></table>`;
}
let retourCiv=null, civOuverte=null;
function ouvrirCiv(id){
  const c=civParId[id]; if(!c) return;
  civOuverte=id;
  const cig=c.refs.map(r=>ficheParId[r]).filter(Boolean)
    .sort((a,b)=>((a.marque||'')+' '+a.nom).localeCompare((b.marque||'')+' '+b.nom,'fr'));
  const q=encodeURIComponent(c.nom+', '+c.adresse);
  const liens=[c.facebook&&['Facebook',c.facebook],c.instagram&&['Instagram',c.instagram],c.site&&['Site web',c.site]].filter(Boolean);
  $('civModale').innerHTML=`<button class="fermer" onclick="fermerCiv()" aria-label="Fermer">✕</button>
    <h2 id="civNom">${esc(c.nom)}</h2>
    <div class="meta">${esc(c.adresse)}</div>
    <div class="civLiens"><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Voir sur la carte ↗</a>
      ${liens.map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}</div>
    <div class="lbl" style="margin-top:14px">Cigares achetés ici (${cig.length})</div>
    <div class="card" style="cursor:default;margin-top:6px">${cig.map(x=>`<div class="civCig lien" onclick="civVersCigare('${x.id}')">
        <span class="n">${esc(((x.marque||'')+' '+(x.nom||x.id)).trim())}<small>${[x.vitole,x.paysFab].filter(Boolean).map(esc).join(' · ')}</small></span>
        <span class="dr">${x.maNote!=null?`<span class="note">★ ${virgule(x.maNote)}</span>`:''}${x.stock>0?`<span class="st">en stock : ${x.stock}</span>`:''}</span>
        <span>›</span></div>`).join('')||'<div class="vide">Aucun cigare enregistré pour l\'instant.</div>'}</div>`;
  $('civVoile').style.display='flex';
  document.body.style.overflow='hidden';
  $('civModale').scrollTop=0;
}
function fermerCiv(){ $('civVoile').style.display='none'; document.body.style.overflow=''; civOuverte=null; }
function civVersCigare(id){
  const depuis=onglet, c=civOuverte;
  fermerCiv();
  if(onglet!=='cigares') allerOnglet('cigares');
  if(depuis==='bord') retourCiv=c;
  voir(id);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&civOuverte) fermerCiv(); });
['q','filtre','tri'].forEach(id=>$(id).addEventListener('input',rendre));
rendre();
</script>
</body>
