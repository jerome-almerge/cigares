<!doctype html>
<html lang="fr" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes Cigares</title>
<style>
:root{
  --bg:#f6f2ec; --card:#ffffff; --ink:#2b2018; --muted:#8a7a6a; --accent:#8c4a2f;
  --gold:#b8860b; --line:#e7ddd0; --ok:#2e7d32; --chip:#f0e8dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120d; --card:#221a13; --ink:#efe6da; --muted:#a3917e; --accent:#d98e5f;
    --gold:#e0b84c; --line:#36291e; --ok:#7bc47f; --chip:#2e241a;
  }
}
:root[data-theme="dark"]{
  --bg:#17120d; --card:#221a13; --ink:#efe6da; --muted:#a3917e; --accent:#d98e5f;
  --gold:#e0b84c; --line:#36291e; --ok:#7bc47f; --chip:#2e241a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:1.25rem;margin:0 0 8px;letter-spacing:.5px}
h1 small{color:var(--muted);font-weight:normal;font-size:.75rem}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input[type=search],select{flex:1 1 140px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;min-width:0}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}
.count{color:var(--muted);font-size:.85rem;margin:6px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;cursor:pointer}
.card:active{opacity:.8}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.marque{color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
.nom{font-weight:bold}
.note{color:var(--gold);white-space:nowrap;font-size:.95rem}
.meta{color:var(--muted);font-size:.85rem;margin-top:2px}
.badges{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:20px;padding:2px 10px;font-size:.75rem;color:var(--muted)}
.chip.cave{color:var(--ok);font-weight:bold}
.detail .card{cursor:default}
.back{display:inline-block;margin:4px 0 2px;color:var(--accent);cursor:pointer;font-size:.9rem}
.deg{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.deg:first-of-type{border-top:none}
.degdate{color:var(--muted);font-size:.8rem}
.degnote{color:var(--gold);font-size:.9rem}
.txt{white-space:pre-line;margin:6px 0 0;font-size:.95rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:8px}
.stars{color:var(--gold);letter-spacing:2px;font-size:.8rem}
.nd{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:.8rem;color:var(--muted);margin-top:6px}
footer{color:var(--muted);text-align:center;font-size:.75rem;padding:20px;border-top:1px solid var(--line)}
.vide{color:var(--muted);text-align:center;padding:30px 0}
.onglets{display:flex;gap:8px;margin-bottom:8px}
.onglets button{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer}
.onglets button.actif{color:var(--accent);border-color:var(--accent);font-weight:bold}
.chrono{display:flex;align-items:flex-end;gap:4px;padding:22px 2px 6px;overflow-x:auto}
.cGrp{flex:1 1 0;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:10px;padding:6px 2px}
.cGrp:active{background:var(--chip)}
.cCols{display:flex;align-items:flex-end;gap:3px;height:120px}
.cCol{width:15px;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cCol.e{background:var(--ok)}.cCol.s{background:var(--accent)}
.cCol .v{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--muted)}
.cGrp .per{font-size:.75rem;font-weight:bold}
.cGrp .solde{font-size:.65rem;border-radius:9px;padding:1px 7px;background:var(--chip);color:var(--muted)}
.cGrp .solde.plus{color:var(--ok)}.cGrp .solde.moins{color:var(--accent)}
.cLeg{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin:4px 2px;flex-wrap:wrap}
.cLeg .pt{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mvtL{display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-top:1px solid var(--line);font-size:.9rem}
.mvtL:first-of-type{border-top:none}
.mvtL .d{color:var(--muted);font-size:.75rem;white-space:nowrap}
.mvtL .n{flex:1;min-width:0}
.mvtL.lien{cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Mes Cigares <small id="version"></small></h1>
  <div class="onglets">
    <button id="ongCigares" class="actif" onclick="allerOnglet('cigares')">Cigares</button>
    <button id="ongTemps" onclick="allerOnglet('temps')">Au fil du temps</button>
  </div>
  <div class="controls" id="barreCigares">
    <input type="search" id="q" placeholder="Marque, cigare, arôme…" autocomplete="off">
    <select id="filtre">
      <option value="">Tous</option>
      <option value="cave">En cave</option>
      <option value="degustes">Dégustés</option>
      <option value="avis">Avec mon avis</option>
    </select>
    <select id="tri">
      <option value="note">Tri : ma note</option>
      <option value="marque">Tri : marque</option>
      <option value="recent">Tri : dernière dégustation</option>
    </select>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="liste"></div>
  <div id="detail" class="detail" style="display:none"></div>
  <div id="temps" style="display:none"></div>
</main>
<footer>Données personnelles de dégustation — mises à jour depuis ma base locale.</footer>
<script src="donnees-public.js?v=2026-10-13-0445"></script>
<script>
const D = window.DONNEES_PUB || {referentiel:[],degustations:[],stock:{}};
document.getElementById('version').textContent = 'v' + (D.version || '');
const degsParRef = {};
for (const g of D.degustations) (degsParRef[g.refId] = degsParRef[g.refId] || []).push(g);
for (const k in degsParRef) degsParRef[k].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const fiches = D.referentiel.map(r => {
  const gs = degsParRef[r.id] || [];
  const notes = gs.map(g=>g.maNote).filter(n=>typeof n==='number');
  const maNote = notes.length ? notes[0] : null; // note la plus récente
  const texte = gs.some(g=>(g.publication||g.ressenti||g.contexte||'').trim());
  return {...r, gs, maNote, nbDeg:gs.length, texte,
    derniere: gs.length ? String(gs[0].date) : '',
    stock: D.stock[r.id] || 0,
    hay: (r.marque+' '+r.nom+' '+r.vitole+' '+r.paysFab+' '+r.cape+' '+r.tripe+' '+gs.map(g=>(g.publication||'')+' '+(g.ressenti||'')).join(' ')).toLowerCase()};
});
const $=id=>document.getElementById(id);
const et=n=>n==null?'':'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
function fdate(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; const [a,m,j]=s.split('-'); return j+'/'+m+'/'+a; }
function rendre(){
  const q=$('q').value.trim().toLowerCase(), f=$('filtre').value, t=$('tri').value;
  let L=fiches.filter(x=>!q||x.hay.includes(q));
  if(f==='cave')L=L.filter(x=>x.stock>0);
  if(f==='degustes')L=L.filter(x=>x.nbDeg>0);
  if(f==='avis')L=L.filter(x=>x.texte);
  if(t==='note')L.sort((a,b)=>(b.maNote??-1)-(a.maNote??-1));
  if(t==='marque')L.sort((a,b)=>(a.marque+a.nom).localeCompare(b.marque+b.nom));
  if(t==='recent')L.sort((a,b)=>b.derniere.localeCompare(a.derniere));
  $('count').textContent=L.length+' cigare'+(L.length>1?'s':'');
  $('detail').style.display='none';
  $('liste').style.display='';
  $('liste').innerHTML=L.length?L.map(x=>`
   <div class="card" onclick="voir('${x.id}')">
     <div class="row"><span class="marque">${x.marque||''}</span>
       <span class="note">${x.maNote!=null?'★ '+x.maNote.toFixed(1):''}</span></div>
     <div class="nom">${x.nom||x.id}</div>
     <div class="meta">${[x.vitole,x.paysFab].filter(Boolean).join(' · ')}</div>
     <div class="badges">
       ${x.stock>0?`<span class="chip cave">En cave ×${x.stock}</span>`:''}
       ${x.nbDeg?`<span class="chip">${x.nbDeg} dégustation${x.nbDeg>1?'s':''}</span>`:''}
       ${x.texte?'<span class="chip">mon avis ✍</span>':''}
     </div>
   </div>`).join(''):'<div class="vide">Aucun cigare ne correspond.</div>';
}
/* ===== onglets ===== */
let onglet='cigares';
function allerOnglet(o){
  onglet=o;
  document.getElementById('ongCigares').classList.toggle('actif',o==='cigares');
  document.getElementById('ongTemps').classList.toggle('actif',o==='temps');
  $('barreCigares').style.display=o==='cigares'?'':'none';
  $('count').style.display=o==='cigares'?'':'none';
  $('temps').style.display=o==='temps'?'':'none';
  $('detail').style.display='none';
  if(o==='cigares'){ $('liste').style.display=''; rendre(); }
  else { $('liste').style.display='none'; rendreTemps(); }
  window.scrollTo(0,0);
}
/* ===== au fil du temps (nombres uniquement) ===== */
const MOIS_C=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
const MOIS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let tempsVue={};
function rendreTemps(){
  const M=D.mouvements||[];
  const el=$('temps');
  const somme=l=>l.reduce((s,m)=>s+(m.q||0),0);
  const E=M.filter(m=>m.t==='e'), S=M.filter(m=>m.t==='s');
  const solde=somme(E)-somme(S);
  let nav='', corps='', titre='', aide='';
  if(tempsVue.mois){
    titre='Détail de '+MOIS_L[parseInt(tempsVue.mois.slice(5))-1]+' '+tempsVue.mois.slice(0,4);
    nav=`<span class="back" onclick="tempsVue={};rendreTemps()">← Toutes les années</span> &nbsp;
         <span class="back" onclick="delete tempsVue.mois;rendreTemps()">← ${tempsVue.annee} mois par mois</span>`;
    const fil=M.filter(m=>m.d.slice(0,7)===tempsVue.mois);
    const lig=m=>{const r=fiches.find(f=>f.id===m.ref);
      return `<div class="mvtL${r?' lien':''}" ${r?`onclick="voir('${m.ref}')"`:''}>
        <span class="d">${m.d.slice(8)}/${m.d.slice(5,7)}</span>
        <span class="n">${m.n||m.ref}${(m.q||1)>1?' ×'+m.q:''}</span>${r?'<span>›</span>':''}</div>`;};
    const Em=fil.filter(m=>m.t==='e').sort((a,b)=>a.d<b.d?-1:1);
    const Sm=fil.filter(m=>m.t==='s').sort((a,b)=>a.d<b.d?-1:1);
    corps=`<div class="card" style="cursor:default"><div class="lbl" style="color:var(--ok)">🟢 Rentrés (${somme(Em)})</div>
        ${Em.map(lig).join('')||'<div class="vide">Aucune entrée ce mois-ci.</div>'}</div>
      <div class="card" style="cursor:default"><div class="lbl" style="color:var(--accent)">🔴 Dégustés / sortis (${somme(Sm)})</div>
        ${Sm.map(lig).join('')||'<div class="vide">Aucune sortie ce mois-ci.</div>'}</div>`;
  } else {
    const parAnnee=!tempsVue.annee;
    titre=parAnnee?'Année par année':tempsVue.annee+' — mois par mois';
    aide=parAnnee?'touche une année pour le mois par mois':'touche un mois pour le détail';
    if(!parAnnee) nav=`<span class="back" onclick="tempsVue={};rendreTemps()">← Toutes les années</span>`;
    const fil=parAnnee?M:M.filter(m=>m.d.slice(0,4)===tempsVue.annee);
    const par={};
    for(const m of fil){const k=parAnnee?m.d.slice(0,4):m.d.slice(0,7);(par[k]=par[k]||{e:0,s:0})[m.t]+=m.q||0;}
    const cles=Object.keys(par).sort();
    const max=Math.max(1,...cles.flatMap(k=>[par[k].e,par[k].s]));
    corps=`<div class="chrono">`+cles.map(k=>{
      const p=par[k], so=p.e-p.s, lib=parAnnee?k:MOIS_C[parseInt(k.slice(5))-1];
      const clic=parAnnee?`tempsVue={annee:'${k}'};rendreTemps()`:`tempsVue.mois='${k}';rendreTemps()`;
      return `<div class="cGrp" onclick="${clic}">
        <div class="cCols">
          <div class="cCol e" style="height:${Math.max(2,Math.round(p.e/max*120))}px"><span class="v">${p.e||''}</span></div>
          <div class="cCol s" style="height:${Math.max(2,Math.round(p.s/max*120))}px"><span class="v">${p.s||''}</span></div>
        </div><span class="per">${lib}</span>
        <span class="solde ${so>0?'plus':so<0?'moins':''}">${so>0?'+':''}${so}</span></div>`;
    }).join('')+`</div>`;
  }
  el.innerHTML=`<div class="count">${somme(E)} rentrés · ${somme(S)} dégustés · solde ${solde>0?'+':''}${solde} en cave</div>
    ${nav?`<div style="margin:4px 0">${nav}</div>`:''}
    <div class="card" style="cursor:default">
      <div class="row"><b>${titre}</b><span class="degdate">${aide}</span></div>
      <div class="cLeg"><span><span class="pt" style="background:var(--ok)"></span>rentrés</span>
        <span><span class="pt" style="background:var(--accent)"></span>dégustés / sortis</span></div>
      ${corps.startsWith('<div class="chrono"')?corps:''}
    </div>${corps.startsWith('<div class="chrono"')?'':corps}`;
}
function voir(id){
  const x=fiches.find(f=>f.id===id); if(!x)return;
  $('liste').style.display='none';
  $('temps').style.display='none';
  const dv=$('detail'); dv.style.display='';
  const origines=[['Pays',x.paysFab],['Cape',x.cape],['Sous-cape',x.sousCape],['Tripe',x.tripe]].filter(o=>o[1]);
  dv.innerHTML=`<span class="back" onclick="retourDepuisFiche()">← Retour</span>
   <div class="card">
    <div class="row"><span class="marque">${x.marque||''}</span>
      <span class="note">${x.maNote!=null?'★ '+x.maNote.toFixed(1):''}</span></div>
    <div class="nom" style="font-size:1.15rem">${x.nom||x.id}</div>
    <div class="meta">${[x.vitole,x.module,x.dimensions].filter(Boolean).join(' · ')}</div>
    ${x.stock>0?`<div class="badges"><span class="chip cave">En cave ×${x.stock}</span></div>`:''}
    ${origines.length?`<div class="lbl">Origines</div><div class="nd">${origines.map(o=>`<span>${o[0]}</span><span>${o[1]}</span>`).join('')}</div>`:''}
    ${x.gs.map(g=>{
      const nd=g.notesDetail;
      return `<div class="deg">
      <div class="row"><span class="degdate">${fdate(String(g.date))}${g.precision&&g.precision!=='exacte'?' (approx.)':''}</span>
        <span class="degnote">${g.maNote!=null?'★ '+g.maNote:''}</span></div>
      ${nd?`<div class="nd"><span>Tirage</span><span class="stars">${et(nd.tirage)}</span><span>Apparence</span><span class="stars">${et(nd.apparence)}</span><span>Combustion</span><span class="stars">${et(nd.combustion)}</span><span>Arôme</span><span class="stars">${et(nd.arome)}</span><span>Goût</span><span class="stars">${et(nd.gout)}</span></div>`:''}
      ${g.contexte?`<div class="lbl">Contexte</div><div class="txt">${g.contexte}</div>`:''}
      ${g.ressenti?`<div class="lbl">Ressenti</div><div class="txt">${g.ressenti}</div>`:''}
      ${g.publication?`<div class="lbl">Mon avis</div><div class="txt">${g.publication}</div>`:''}
      </div>`;}).join('')||'<div class="vide">Pas encore dégusté.</div>'}
   </div>`;
  window.scrollTo(0,0);
}
function retourDepuisFiche(){
  $('detail').style.display='none';
  if(onglet==='temps'){ $('temps').style.display=''; rendreTemps(); window.scrollTo(0,0); }
  else rendre();
}
['q','filtre','tri'].forEach(id=>$(id).addEventListener('input',rendre));
rendre();
</script>
</body>
</html>
