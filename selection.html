<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sélection du cigare</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : barre fixe (titre + recherche + onglets), liste dense une ligne par cigare, total collé en bas dans Ma liste */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#1C2320; --muted:#5E6A64; --line:#DCE2DE;
  --accent:#2E5B4E; --accent-ink:#FFFFFF; --soft:#E3ECE7;
  --leger:#3E7A3A; --leger-bg:#E4F0E1; --moyen:#9A6410; --moyen-bg:#F6EBD6; --fort:#A33A2A; --fort-bg:#F6E1DC;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1C2320; --ink:#E7ECE9; --muted:#9AA8A1; --line:#2C3631;
  --accent:#7FB8A4; --accent-ink:#0F1513; --soft:#22302A;
  --leger:#9ACF92; --leger-bg:#22331F; --moyen:#E7B862; --moyen-bg:#3A2E17; --fort:#F09A88; --fort-bg:#3E231D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1C2320; --ink:#E7ECE9; --muted:#9AA8A1; --line:#2C3631;
  --accent:#7FB8A4; --accent-ink:#0F1513; --soft:#22302A;
  --leger:#9ACF92; --leger-bg:#22331F; --moyen:#E7B862; --moyen-bg:#3A2E17; --fort:#F09A88; --fort-bg:#3E231D; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1{text-wrap:balance}
h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.02em}
.by{font-family:var(--f-display);font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.search{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:4px;border-radius:10px}
.tab{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:20px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cols{display:grid;grid-template-columns:24px minmax(0,1fr) 36px 44px 64px;gap:8px;font-family:var(--f-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:4px 4px 6px;border-bottom:1px solid var(--line)}
.cols span:nth-child(n+3){text-align:right}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) 36px 44px 64px;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.nm{min-width:0}
.nm b{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.25}
.sub{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:12.5px;color:var(--muted);min-width:0}
.sub span.o{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;flex:none}
.f.L{background:var(--leger-bg);color:var(--leger)} .f.M{background:var(--moyen-bg);color:var(--moyen)} .f.F{background:var(--fort-bg);color:var(--fort)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ni{font-weight:600} .nj{color:var(--accent);font-weight:600} .px{font-weight:600} .na{color:var(--muted);font-weight:400}
.empty{padding:28px 4px;color:var(--muted)}
.more{display:block;margin:12px auto;font:inherit}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto 70px;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.qty output{min-width:18px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .in{max-width:760px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px}
.tot{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tot small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px;white-space:nowrap}
.tot{white-space:nowrap}
.btn{white-space:nowrap}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin:18px 4px 0}
textarea.copy{width:100%;box-sizing:border-box;min-height:120px;margin-top:10px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px}
@media (min-width:640px){.cols,.row{grid-template-columns:28px minmax(0,1fr) 64px 64px 76px}}
.legend{font-size:12px;color:var(--muted);margin:6px 4px 0}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}.row:hover{background:var(--soft)}}
</style>
</head><body>

<div class="wrap">
<header>
  <div class="brand"><h1>Sélection du cigare dans les civettes françaises</h1><span class="by">by Le Troisième Tiers</span></div>
  <input id="q" class="search" type="search" placeholder="Marque, gamme ou vitole…" autocomplete="off" aria-label="Rechercher un cigare">
  <div class="tabs" role="tablist">
    <button id="t-sel" class="tab" role="tab" aria-selected="true">Sélection</button>
    <button id="t-list" class="tab" role="tab" aria-selected="false">Ma liste<span id="nb" class="count" hidden>0</span></button>
  </div>
</header>

<section id="v-sel">
  <div class="tools" style="margin:2px 0 10px">

    <button class="chip" data-s="note" aria-pressed="false">Note</button>

    <button class="chip" data-s="nom" aria-pressed="true">Nom</button>
    <span style="margin-left:6px">Force :</span>
    <button class="chip" data-f="L" aria-pressed="false">Léger</button>
    <button class="chip" data-f="M" aria-pressed="false">Moyen</button>
    <button class="chip" data-f="F" aria-pressed="false">Fort</button>
  </div>
  <p class="legend">Note : moyenne des internautes sur 5. Jérôme : note du Troisième Tiers.</p>
  <div class="cols"><span></span><span>Cigare · cape / sous-cape / tripe</span><span title="Note moyenne des internautes">Note</span><span>Jérôme</span><span>Prix</span></div>
  <div id="rows"></div>
  <button id="more" class="chip more" hidden>Afficher plus</button>
</section>

<section id="v-list" hidden>
  <div id="items"></div>
  <div id="copybox"></div>
</section>

<p class="note" id="src"></p>
</div>

<div class="bar" id="bar" hidden><div class="in">
  <div class="tot" id="tot">0,00 €<small id="tq"></small></div>
  <div style="display:flex;gap:8px"><button class="btn ghost" id="clear">Vider</button><button class="btn" id="copy">Copier</button></div>
</div></div>

const $=s=>document.querySelector(s);
const eur=v=>v==null?'—':v.toFixed(2).replace('.',',')+' €';
const n1=v=>v==null?'<span class="na">—</span>':(Math.round(v*10)/10).toString().replace('.',',');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
D.forEach(x=>x.k=norm(x.n+' '+(x.o||'')));
const byId=Object.fromEntries(D.map(x=>[x.id,x]));
let sel={};try{sel=JSON.parse(localStorage.getItem('sel')||'{}')||{}}catch(e){sel={}}
for(const k in sel) if(!byId[k]) delete sel[k];
const save=()=>{try{localStorage.setItem('sel',JSON.stringify(sel))}catch(e){}};
let sortBy='nom',force=null,limit=60;
const FL={L:'Léger',M:'Moyen',F:'Fort'};

function filtered(){
  const words=norm($('#q').value).split(/\s+/).filter(Boolean);
  let r=D.filter(x=>(!force||x.f===force)&&words.every(w=>x.k.includes(w)));
  const cmp={note:(a,b)=>(b.ni??-1)-(a.ni??-1)||(a.p??999)-(b.p??999),prix:(a,b)=>(a.p??999)-(b.p??999),nom:(a,b)=>a.n.localeCompare(b.n,'fr')}[sortBy];
  return r.sort(cmp);
}
function rowHTML(x){
  return `<label class="row"><input type="checkbox" data-id="${x.id}" ${sel[x.id]?'checked':''} aria-label="Choisir ${x.n.replace(/"/g,'')}">
  <span class="nm"><b>${x.n}</b><span class="sub">${x.f?`<span class="f ${x.f}">${FL[x.f]}</span>`:''}<span class="o">${x.o||''}</span></span></span>
  <span class="num ni">${n1(x.ni)}</span><span class="num nj">${x.nj==null?'<span class="na">—</span>':n1(x.nj)}</span><span class="num px">${eur(x.p)}</span></label>`;
}
function renderSel(){
  const r=filtered();
  $('#rows').innerHTML=r.length?r.slice(0,limit).map(rowHTML).join(''):'<p class="empty">Aucun cigare ne correspond. Essayez la marque seule, par exemple « padron ».</p>';
  $('#more').hidden=r.length<=limit; $('#more').textContent=`Afficher plus (${r.length-limit} restants)`;
}
function totals(){let n=0,t=0;for(const[k,q]of Object.entries(sel)){n+=q;t+=q*(byId[k].p||0)}return{n,t}}
function renderList(){
  const ids=Object.keys(sel);
  $('#items').innerHTML=ids.length?ids.map(k=>{const x=byId[k];return `<div class="li"><span class="nm"><b>${x.n}</b><span class="sub">${x.f?`<span class="f ${x.f}">${FL[x.f]}</span>`:''}<span>${eur(x.p)} l'unité</span></span></span>
    <span class="qty"><button data-m="${k}" aria-label="Retirer un">−</button><output>${sel[k]}</output><button data-p="${k}" aria-label="Ajouter un">+</button></span><span class="num px">${eur((x.p||0)*sel[k])}</span></div>`}).join('')
    :'<p class="empty">Votre liste est vide. Cochez des cigares dans l’onglet Sélection.</p>';
}
function refresh(){
  const {n,t}=totals(); $('#nb').hidden=!n; $('#nb').textContent=n;
  $('#bar').hidden=!n; $('#tot').firstChild.nodeValue=eur(t); $('#tq').textContent=n+(n>1?' cigares':' cigare');
  if(!$('#v-list').hidden) renderList();
}
function listText(){const {n,t}=totals();return Object.keys(sel).map(k=>`${sel[k]} × ${byId[k].n} — ${eur(byId[k].p)}`).join('\n')+`\nTotal : ${n} cigare${n>1?'s':''} — ${eur(t)}`}
$('#q').addEventListener('input',()=>{limit=60;renderSel()});
$('#rows').addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;if(e.target.checked)sel[id]=1;else delete sel[id];save();refresh()});
$('#more').onclick=()=>{limit+=60;renderSel()};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sortBy=b.dataset.s;document.querySelectorAll('[data-s]').forEach(c=>c.setAttribute('aria-pressed',c===b));renderSel()});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{force=force===b.dataset.f?null:b.dataset.f;document.querySelectorAll('[data-f]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===force));renderSel()});
$('#items').addEventListener('click',e=>{const p=e.target.dataset.p,m=e.target.dataset.m;if(p)sel[p]++;if(m){sel[m]--;if(sel[m]<=0)delete sel[m]}if(p||m){save();refresh();renderSel()}});
function show(list){$('#v-sel').hidden=list;$('#v-list').hidden=!list;$('#t-sel').setAttribute('aria-selected',!list);$('#t-list').setAttribute('aria-selected',list);if(list)renderList();else renderSel()}
$('#t-sel').onclick=()=>show(false);$('#t-list').onclick=()=>show(true);
$('#q').addEventListener('focus',()=>{if(!$('#v-list').hidden)show(false)});
$('#clear').onclick=()=>{if($('#clear').dataset.c){sel={};save();refresh();renderSel();$('#clear').textContent='Vider';delete $('#clear').dataset.c}else{$('#clear').dataset.c=1;$('#clear').textContent='Confirmer';setTimeout(()=>{$('#clear').textContent='Vider';delete $('#clear').dataset.c},3000)}};
$('#copy').onclick=async()=>{const t=listText();try{await navigator.clipboard.writeText(t);$('#copy').textContent='Liste copiée';setTimeout(()=>$('#copy').textContent='Copier',2000)}catch(e){show(true);$('#copybox').innerHTML='<textarea class="copy" readonly></textarea>';const ta=$('#copybox textarea');ta.value=t;ta.focus();ta.select()}};
$('#src').textContent=`Cigares vendus en France — prix : liste des prix homologués publiée par les douanes (${META.prix||''}). Note internautes : moyenne des notes publiées. ${D.length} cigares. ${META.etat||''}`;
renderSel();refresh();
</script>
